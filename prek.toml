# Install the git hook once per clone with `prek install`.
# Every hook runs across the whole workspace, not just the staged crate.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
language = "system"
entry = "cargo fmt --all -- --check"
types = ["rust"]
pass_filenames = false

[[repos.hooks]]
id = "cargo-build"
name = "cargo build"
language = "system"
entry = "cargo build --workspace --all-targets --all-features"
types_or = ["rust", "toml"]
pass_filenames = false

[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
language = "system"
entry = "cargo clippy --workspace --all-targets --all-features -- -D warnings"
types_or = ["rust", "toml"]
pass_filenames = false

[[repos.hooks]]
id = "cargo-test"
name = "cargo test"
language = "system"
entry = "cargo test --workspace --all-features"
types_or = ["rust", "toml", "markdown"]
pass_filenames = false

# XXX: rockstar (6 Oct 2026) - amp-protocol hasn't been released yet, so we can't
# check against an existing version. Remove the --exclude after we've published
# the first version.
[[repos.hooks]]
id = "cargo-semver-checks"
name = "cargo semver-checks"
language = "system"
entry = "cargo semver-checks --workspace --exclude amp-protocol"
types_or = ["rust", "toml"]
pass_filenames = false

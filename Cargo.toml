[workspace]
resolver = "2"
members = ["amp-protocol", "serde_amp"]

# Fields shared by every crate in the workspace. A crate opts in with
# `<field>.workspace = true` in its own Cargo.toml.
[workspace.package]
edition = "2021"
authors = ["Paul Hummer <paul@eventuallyanyway.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rockstar/serde_amp"

[workspace.dependencies]
bytes = "1"
serde = "1"
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", features = ["codec"] }

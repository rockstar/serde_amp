# Publish one workspace crate to crates.io when its release tag is pushed.
# Tags are named `<crate>-<version>`, for example `serde_amp-0.3.0`.
name: release

on:
  push:
    tags:
      - "*-[0-9]+.[0-9]+.[0-9]+*"
      - "*-v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    outputs:
      crate: ${{ steps.tag.outputs.crate }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Parse the tag and check it against the crate's Cargo.toml
        id: tag
        run: |
          crate="${GITHUB_REF_NAME%-*}"
          version="${GITHUB_REF_NAME##*-}"
          version="${version#v}"
          manifest_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg crate "$crate" '.packages[] | select(.name == $crate) | .version')"
          echo "crate=$crate  tag version=$version  Cargo.toml version=${manifest_version:-<no such crate>}"
          if [ -z "$manifest_version" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' names crate '$crate', which is not a workspace member"
            exit 1
          fi
          if [ "$version" != "$manifest_version" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match $crate's Cargo.toml version '$manifest_version'"
            exit 1
          fi
          echo "crate=$crate" >> "$GITHUB_OUTPUT"

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - name: Dry-run the publish
        run: cargo publish --dry-run -p "${{ steps.tag.outputs.crate }}"

  publish:
    name: Publish ${{ needs.verify.outputs.crate }} to crates.io
    runs-on: ubuntu-latest
    needs: verify
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        run: cargo publish -p "${{ needs.verify.outputs.crate }}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
